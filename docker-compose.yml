services:
  wiremock:
    image: wiremock/wiremock:3.6.0
    ports:
      - "8080:8080"
    volumes:
      - ./src/apiTest/resources/mappings:/home/wiremock/mappings
      - ./src/apiTest/resources/__files:/home/wiremock/__files
    command:
      - "--global-response-templating"
      - "--verbose"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CP_BACKEND_URL: "http://wiremock:8080"
      # API tests run against this container; the local profile is what permits AUTH_MODE=OFF
      SPRING_PROFILES_ACTIVE: "local"
      AUTH_MODE: "OFF"
    ports:
      - "4550:4550"